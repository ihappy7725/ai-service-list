          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.6-9.2C.9 7.9 3.1 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.5 0 5.7 3.4 4.2 6.8-2.1 4.6-9.6 9.2-9.6 9.2z"/></svg>

        <a class="btn btn-ghost btn-sm home-btn" href="index.html" data-i18n="btn.home">홈으로</a>
        <button type="button" class="menu-btn" aria-expanded="false" data-i18n-aria="nav.menu"><span></span></button>
      </div>

  <!-- ===== 페이지 머리 ===== -->
  <section class="tools-hero">
    <div class="floaters" aria-hidden="true">
      <div class="floater hide-sm" style="--x:80%;--y:24%;--s:120px;--depth:0;--dur:6.8s;--rot:8deg"><img src="img/3d/hero-robot.png" alt=""></div>

    <div class="container">
      <span class="eyebrow" data-i18n="tools.eyebrow">AI TOOLS</span>
      <h1 data-i18n="tools.title">AI 툴 둘러보기</h1>
      <p data-i18n="tools.sub"></p>
    </div>

  <div class="controls">
    <div class="container">
      <div class="controls-row">
        <div class="search-row">
          <div class="search" role="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>

            <button type="button" class="search-clear" id="qClear" hidden data-i18n-aria="search.clear">×</button>
          </div>
          <button type="button" class="filter-btn" id="filterBtn" aria-expanded="false" aria-controls="filterPanel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
            <span data-i18n="filter.btn">필터</span>
            <span class="filter-count" hidden>0</span>
          </button>
        </div>
        <div class="filter-tags" id="filterTags" hidden></div>
        <div class="filter-panel" id="filterPanel">
          <div>
            <div class="filter-panel__inner">
              <div class="filter-body" id="filterBody"></div>
              <div class="filter-foot">
                <span class="filter-result" id="filterResult"></span>
                <button type="button" class="filter-reset" id="filterReset" data-i18n="filter.reset">초기화</button>
                <button type="button" class="btn btn-primary btn-sm" id="filterDone" data-i18n="filter.done">결과 보기</button>
              </div>
            </div>
          </div>
        </div>
        <div class="chips" id="catChips" role="group" data-i18n-aria="filter.cat"></div>
      </div>
      <div class="subchips-wrap" id="subWrap">
        <div><div class="subchips" id="subChips" role="group" data-i18n-aria="filter.sub"></div></div>
      </div>
    </div>
  </div>

  <!-- ===== 카드 목록 ===== -->
  <main class="tools-main container">
    <section class="view-banner" id="viewBanner" hidden></section>
    <div class="grid" id="grid"></div>

  <footer class="site-footer">

      <div class="footer-grid">
        <div class="footer-about">
          <a class="brand" href="index.html"><img src="img/logo/ai-atlas-logo.png" alt="" width="38" height="38"><span class="brand-name"><b>AI</b> ATLAS</span></a>
